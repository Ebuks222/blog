<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Connect Blog</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f3f0;
            color: #1c1c1c;
            line-height: 1.8;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 0 28px; }
        
        .site-header {
            background: #1a1a1a;
            padding: 28px 0 22px;
            margin-bottom: 48px;
            border-bottom: 3px solid #8b1a2b;
        }
        .site-header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
        .logo-icon {
            width: 48px; height: 48px; background: #8b1a2b; color: #fff; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px;
        }
        .logo-text { font-size: 1.35rem; font-weight: 600; color: #f5f3f0; font-family: 'IBM Plex Serif', serif; }
        .logo-text span { font-weight: 300; color: #a8a8a8; }
        .header-tagline { font-size: 0.7rem; color: #a8a8a8; text-transform: uppercase; border-left: 2px solid #8b1a2b; padding-left: 18px; }
        
        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: #8b1a2b;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
        
        .post-full {
            background: #fff;
            border-radius: 8px;
            padding: 40px 44px;
            border-left: 4px solid #8b1a2b;
        }
        .post-full .post-meta {
            font-size: 0.7rem; color: #6b6b6b; text-transform: uppercase; font-weight: 600;
            margin-bottom: 10px;
        }
        .post-full .post-meta .category {
            background: #f5f3f0; padding: 2px 14px; border-radius: 2px;
            color: #1a1a1a; font-weight: 600; font-size: 0.6rem; margin-left: 10px;
        }
        .post-full h1 {
            font-family: 'IBM Plex Serif', serif;
            font-size: 2.4rem;
            color: #1a1a1a;
            margin-bottom: 16px;
        }
        .post-full .featured-image {
            width: 100%; max-height: 500px; object-fit: cover; border-radius: 8px;
            margin: 16px 0 24px 0; border: 1px solid #e8e4de;
        }
        .post-full .post-body { font-size: 1.1rem; color: #2a2a2a; }
        .post-full .post-body p { margin-bottom: 1.2rem; }
        .post-full .post-body img { max-width: 100%; border-radius: 8px; margin: 16px 0; }
        
        .site-footer {
            background: #1a1a1a;
            padding: 32px 0 36px;
            margin-top: 48px;
            text-align: center;
            color: #a8a8a8;
            font-size: 0.8rem;
            border-top: 3px solid #8b1a2b;
        }
        .site-footer strong { color: #f5f3f0; }
        
        @media (max-width: 700px) {
            .site-header .container { flex-direction: column; align-items: flex-start; }
            .header-tagline { border-left: none; padding-left: 0; }
            .post-full { padding: 24px; }
            .post-full h1 { font-size: 1.8rem; }
        }
        @media (max-width: 480px) {
            .container { padding: 0 16px; }
            .post-full { padding: 18px; }
            .post-full h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container">
            <a href="/" class="logo">
                <div class="logo-icon">SC</div>
                <div class="logo-text">Security <span>Connect</span></div>
            </a>
            <div class="header-tagline">Geopolitical Analysis &bull; Risk Assessment &bull; Strategic Foresight</div>
        </div>
    </header>

    <main class="container">
        <a href="/" class="back-link">← Back to all posts</a>
        
        <div id="post-container">
            <div style="text-align:center;padding:60px 20px;background:#fff;border-radius:8px;border-left:4px solid #8b1a2b;">
                <p>Loading post...</p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            &copy; 2026 <strong>Security Connect Blog</strong> | All rights reserved | London &bull; Singapore &bull; Washington
        </div>
    </footer>

    <script>
        // Get the post slug from the URL path
        // Example: /my-post-title → slug = my-post-title
        const slug = window.location.pathname.replace('/', '').replace('.html', '');
        
        async function loadPost() {
            try {
                if (!slug || slug === '' || slug === 'index.html') {
                    document.getElementById('post-container').innerHTML = `
                        <div style="text-align:center;padding:60px 20px;background:#fff;border-radius:8px;border-left:4px solid #8b1a2b;">
                            <p>No post specified.</p>
                        </div>
                    `;
                    return;
                }
                
                const response = await fetch(`https://api.github.com/repos/Ebuks222/blog/contents/posts/${slug}.md`);
                if (!response.ok) {
                    document.getElementById('post-container').innerHTML = `
                        <div style="text-align:center;padding:60px 20px;background:#fff;border-radius:8px;border-left:4px solid #8b1a2b;">
                            <p>Post not found.</p>
                            <p style="font-size:0.9rem;color:#888;margin-top:8px;">The post "${slug}" does not exist.</p>
                        </div>
                    `;
                    return;
                }
                
                const file = await response.json();
                const content = atob(file.content);
                
                const titleMatch = content.match(/title:\s*["']?(.*?)["']?\n/);
                const dateMatch = content.match(/date:\s*["']?(.*?)["']?\n/);
                const categoryMatch = content.match(/category:\s*["']?(.*?)["']?\n/);
                const imageMatch = content.match(/image:\s*["']?(.*?)["']?\n/);
                const excerptMatch = content.match(/excerpt:\s*["']?(.*?)["']?\n/);
                
                let body = content;
                const bodyStart = content.indexOf('---', content.indexOf('---') + 3) + 3;
                if (bodyStart !== -1) {
                    body = content.substring(bodyStart).trim();
                }
                
                const title = titleMatch ? titleMatch[1] : slug;
                const date = dateMatch ? dateMatch[1] : new Date().toISOString();
                const category = categoryMatch ? categoryMatch[1] : '';
                const image = imageMatch ? imageMatch[1] : '';
                const excerpt = excerptMatch ? excerptMatch[1] : '';
                
                // Convert markdown to HTML
                let bodyHtml = body
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/\n/g, '<br />')
                    .replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1" />');
                
                document.getElementById('post-container').innerHTML = `
                    <article class="post-full">
                        <div class="post-meta">
                            <span class="date">${formatDate(date)}</span>
                            ${category ? `<span class="category">${category}</span>` : ''}
                        </div>
                        <h1>${title}</h1>
                        ${image ? `<img src="${image}" alt="${title}" class="featured-image" />` : ''}
                        ${excerpt ? `<p style="font-size:1.1rem;color:#6b6b6b;font-weight:300;border-left:3px solid #8b1a2b;padding-left:16px;margin-bottom:20px;">${excerpt}</p>` : ''}
                        <div class="post-body">${bodyHtml}</div>
                    </article>
                `;
                
                document.title = `${title} - Security Connect Blog`;
                
            } catch (err) {
                document.getElementById('post-container').innerHTML = `
                    <div style="text-align:center;padding:60px 20px;background:#fff;border-radius:8px;border-left:4px solid #8b1a2b;">
                        <p>Error loading post: ${err.message}</p>
                    </div>
                `;
            }
        }
        
        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }
        
        loadPost();
    </script>

</body>
</html>
